<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Review the decisions inside the design</title><desc id="desc">Walk through material choices before they spread into implementation.. Keep the rationale with the decision, so it can be revisited when requirements change.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197d79"/></marker></defs><rect width="1200" height="500" rx="8" fill="#f4f7f7"/><g font-family="Arial, sans-serif" fill="#142b43"><text x="48" y="69" font-size="32" font-weight="700">Review the decisions inside the design</text><text x="48" y="110" font-size="19" fill="#40556a">Walk through material choices before they spread into implementation.</text><rect x="48" y="176" width="252" height="190" rx="8" fill="#fff" stroke="#b9c8cc"/><text x="68" y="212" font-size="14" fill="#197d79">01</text><text x="68" y="250" font-size="22" font-weight="700">Proposed choice</text><text x="68" y="289" font-size="17" fill="#40556a">What are we choosing?</text><text x="68" y="319" font-size="17" fill="#40556a">Which need does it serve?</text><path d="M 306 270 h 16" stroke="#197d79" stroke-width="3" marker-end="url(#arrow)"/><rect x="328" y="176" width="252" height="190" rx="8" fill="#fff" stroke="#b9c8cc"/><text x="348" y="212" font-size="14" fill="#197d79">02</text><text x="348" y="250" font-size="22" font-weight="700">Alternatives</text><text x="348" y="289" font-size="17" fill="#40556a">What else could work?</text><text x="348" y="319" font-size="17" fill="#40556a">Why reject those options?</text><path d="M 586 270 h 16" stroke="#197d79" stroke-width="3" marker-end="url(#arrow)"/><rect x="608" y="176" width="252" height="190" rx="8" fill="#fff" stroke="#b9c8cc"/><text x="628" y="212" font-size="14" fill="#197d79">03</text><text x="628" y="250" font-size="22" font-weight="700">Consequences</text><text x="628" y="289" font-size="17" fill="#40556a">What becomes harder?</text><text x="628" y="319" font-size="17" fill="#40556a">What could go wrong?</text><path d="M 866 270 h 16" stroke="#197d79" stroke-width="3" marker-end="url(#arrow)"/><rect x="888" y="176" width="252" height="190" rx="8" fill="#fff" stroke="#b9c8cc"/><text x="908" y="212" font-size="14" fill="#197d79">04</text><text x="908" y="250" font-size="22" font-weight="700">Decision status</text><text x="908" y="289" font-size="17" fill="#40556a">Agreed or still open?</text><text x="908" y="319" font-size="17" fill="#40556a">What answer is needed?</text><text x="48" y="435" font-size="20" fill="#197d79">Keep the rationale with the decision, so it can be revisited when requirements change.</text></g></svg>