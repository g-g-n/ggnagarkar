<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI agent execution boundary</title>
  <desc id="desc">An editorial system diagram showing inbound enterprise work moving through an AI agent into an execution boundary with approvals, permissions, background jobs, audit logs, and response routing.</desc>
  <rect width="1200" height="630" fill="#f6f3ee"/>
  <rect x="70" y="70" width="1060" height="490" rx="24" fill="#fffaf3" stroke="#2b2d31" stroke-width="3"/>
  <g fill="none" stroke="#2b2d31" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 190h170"/>
    <path d="M170 260h170"/>
    <path d="M170 330h170"/>
    <path d="M170 400h170"/>
    <path d="M340 295h115"/>
    <path d="M560 315h105"/>
    <path d="M735 220h235"/>
    <path d="M735 315h235"/>
    <path d="M735 410h235"/>
    <path d="M955 220l18 0"/>
    <path d="M955 315l18 0"/>
    <path d="M955 410l18 0"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#202124">
    <text x="90" y="126" font-size="34" font-weight="800">AI Agents Need An Execution Boundary</text>
    <text x="91" y="160" font-size="18" fill="#5d626b">Approvals, permissions, async work, audit trails, and response routing belong in the product contract.</text>
    <g font-size="18" font-weight="700">
      <rect x="135" y="170" width="160" height="42" rx="8" fill="#e6f0ff" stroke="#2b2d31" stroke-width="2"/>
      <text x="161" y="197">Slack / Teams</text>
      <rect x="135" y="240" width="160" height="42" rx="8" fill="#e9f7ef" stroke="#2b2d31" stroke-width="2"/>
      <text x="167" y="267">Jira / SNOW</text>
      <rect x="135" y="310" width="160" height="42" rx="8" fill="#fff2c7" stroke="#2b2d31" stroke-width="2"/>
      <text x="170" y="337">Alerts / APIs</text>
      <rect x="135" y="380" width="160" height="42" rx="8" fill="#f5dfef" stroke="#2b2d31" stroke-width="2"/>
      <text x="173" y="407">Reports / Jobs</text>
    </g>
    <g>
      <circle cx="505" cy="315" r="74" fill="#2b2d31"/>
      <circle cx="505" cy="315" r="52" fill="#ffffff" opacity=".12"/>
      <text x="465" y="306" font-size="19" fill="#ffffff" font-weight="800">Agent</text>
      <text x="445" y="333" font-size="15" fill="#f7d86f" font-weight="700">reasoning</text>
    </g>
    <g>
      <rect x="665" y="166" width="84" height="298" rx="14" fill="#f7d86f" stroke="#2b2d31" stroke-width="3"/>
      <text x="704" y="247" transform="rotate(90 704 247)" font-size="17" font-weight="900">EXECUTION BOUNDARY</text>
    </g>
    <g font-size="18" font-weight="800">
      <rect x="790" y="187" width="170" height="66" rx="10" fill="#ffffff" stroke="#2b2d31" stroke-width="2"/>
      <text x="820" y="214">Permissions</text>
      <text x="822" y="237" font-size="14" font-weight="600" fill="#5d626b">identity + policy</text>
      <rect x="790" y="282" width="170" height="66" rx="10" fill="#ffffff" stroke="#2b2d31" stroke-width="2"/>
      <text x="824" y="309">Approvals</text>
      <text x="818" y="332" font-size="14" font-weight="600" fill="#5d626b">review before risk</text>
      <rect x="790" y="377" width="170" height="66" rx="10" fill="#ffffff" stroke="#2b2d31" stroke-width="2"/>
      <text x="811" y="404">Async jobs</text>
      <text x="820" y="427" font-size="14" font-weight="600" fill="#5d626b">state + retries</text>
    </g>
    <g font-size="16" font-weight="800">
      <rect x="988" y="190" width="88" height="60" rx="10" fill="#2f6fed"/>
      <text x="1010" y="226" fill="#ffffff">Act</text>
      <rect x="988" y="285" width="88" height="60" rx="10" fill="#1f8f5f"/>
      <text x="1002" y="321" fill="#ffffff">Audit</text>
      <rect x="988" y="380" width="88" height="60" rx="10" fill="#c0503d"/>
      <text x="1003" y="416" fill="#ffffff">Route</text>
    </g>
    <text x="91" y="520" font-size="17" font-weight="700" fill="#3d4148">The product decides when the agent acts, waits, queues, records, and delivers.</text>
  </g>
</svg>
