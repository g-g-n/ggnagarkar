<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI agents need an execution boundary</title>
  <desc id="desc">A restrained architecture diagram showing agent reasoning passing through an execution boundary that checks identity, policy, approval, and runtime before tools can act.</desc>
  <rect width="1200" height="630" fill="#F3F0E9"/>
  <rect x="54" y="48" width="1092" height="534" rx="22" fill="#FCFBF7" stroke="#17202A" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="117" fill="#17202A" font-size="19" font-weight="750" letter-spacing="2.4">ENTERPRISE AI ARCHITECTURE</text>
    <text x="94" y="174" fill="#17202A" font-size="45" font-weight="800">AI agents need an</text>
    <text x="94" y="226" fill="#17202A" font-size="45" font-weight="800">execution boundary.</text>
    <text x="96" y="270" fill="#59636E" font-size="19">Reasoning proposes. Policy decides. The runtime executes.</text>

    <g transform="translate(94 331)">
      <rect width="232" height="142" rx="14" fill="#E7EEF4" stroke="#17202A" stroke-width="2"/>
      <circle cx="35" cy="38" r="13" fill="#315D77"/>
      <text x="60" y="45" fill="#17202A" font-size="19" font-weight="750">AGENT</text>
      <text x="28" y="86" fill="#17202A" font-size="24" font-weight="800">Reason + propose</text>
      <text x="28" y="116" fill="#59636E" font-size="16">No direct tool authority</text>
    </g>

    <path d="M326 402H390" stroke="#17202A" stroke-width="3" stroke-linecap="round"/>
    <path d="M380 392L390 402 380 412" fill="none" stroke="#17202A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(390 309)">
      <rect width="408" height="186" rx="16" fill="#F5D66F" stroke="#17202A" stroke-width="3"/>
      <text x="28" y="43" fill="#17202A" font-size="18" font-weight="850" letter-spacing="1.4">EXECUTION BOUNDARY</text>
      <line x1="28" y1="62" x2="380" y2="62" stroke="#17202A" stroke-width="1.5" opacity=".45"/>
      <g fill="#17202A" font-size="18" font-weight="700">
        <circle cx="38" cy="91" r="5"/><text x="54" y="97">Identity + authority</text>
        <circle cx="218" cy="91" r="5"/><text x="234" y="97">Action policy</text>
        <circle cx="38" cy="127" r="5"/><text x="54" y="133">Approval + risk</text>
        <circle cx="218" cy="127" r="5"/><text x="234" y="133">Sync or async</text>
        <circle cx="38" cy="163" r="5"/><text x="54" y="169">Audit + evidence</text>
        <circle cx="218" cy="163" r="5"/><text x="234" y="169">Response route</text>
      </g>
    </g>

    <path d="M798 402H862" stroke="#17202A" stroke-width="3" stroke-linecap="round"/>
    <path d="M852 392L862 402 852 412" fill="none" stroke="#17202A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(862 331)">
      <rect width="244" height="142" rx="14" fill="#DCECDF" stroke="#17202A" stroke-width="2"/>
      <path d="M28 39l9 9 18-21" fill="none" stroke="#2D6A4F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="45" fill="#17202A" font-size="19" font-weight="750">TOOLS</text>
      <text x="28" y="86" fill="#17202A" font-size="24" font-weight="800">Act + deliver</text>
      <text x="28" y="116" fill="#59636E" font-size="16">Observable and reviewable</text>
    </g>

    <text x="94" y="539" fill="#59636E" font-size="16" font-weight="650">ggnagarkar.com  •  AI agents, product architecture, and operational systems</text>
  </g>
</svg>
