<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI agents need an inbound architecture</title>
  <desc id="desc">A structured editorial illustration showing Slack, Teams, Jira, ServiceNow, WhatsApp, alarms, and reports flowing into one normalized AI agent architecture.</desc>
