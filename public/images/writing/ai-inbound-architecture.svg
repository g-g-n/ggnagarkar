  <text x="112" y="190" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">An Inbound Architecture</text>
  <text x="116" y="238" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Slack, Teams, Jira, ServiceNow, WhatsApp, alerts, reports</text>

