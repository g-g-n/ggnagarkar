<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI in SRE needs identity, context, and fallbacks</title>
  <desc id="desc">A restrained architecture diagram showing identity, context, and fallback controls around an AI-assisted SRE incident workflow.</desc>
  <rect width="1200" height="630" fill="#EEF2F1"/>
  <rect x="54" y="48" width="1092" height="534" rx="22" fill="#FCFBF7" stroke="#17202A" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="94" y="115" fill="#17202A" font-size="19" font-weight="750" letter-spacing="2.4">AI OPS / SRE ARCHITECTURE</text>
    <text x="94" y="171" fill="#17202A" font-size="44" font-weight="800">AI in SRE needs</text>
    <text x="94" y="223" fill="#17202A" font-size="44" font-weight="800">identity, context, and fallbacks.</text>
    <text x="96" y="267" fill="#59636E" font-size="19">The model can help investigate. The workflow has to earn trust.</text>

    <g transform="translate(92 330)">
      <rect width="222" height="138" rx="14" fill="#E3EEF1" stroke="#17202A" stroke-width="2"/>
      <circle cx="38" cy="39" r="14" fill="#2F6F73"/>
      <path d="M38 31v16M30 39h16" stroke="#FCFBF7" stroke-width="4" stroke-linecap="round"/>
      <text x="64" y="46" fill="#17202A" font-size="19" font-weight="800">IDENTITY</text>
      <text x="28" y="86" fill="#17202A" font-size="19" font-weight="800">Scope + authority</text>
      <text x="28" y="115" fill="#59636E" font-size="16">Who, where, what access</text>
    </g>

    <g transform="translate(356 304)">
      <rect width="488" height="190" rx="18" fill="#17202A"/>
      <rect x="18" y="18" width="452" height="154" rx="12" fill="#24313D"/>
      <text x="42" y="57" fill="#FCFBF7" font-size="18" font-weight="850" letter-spacing="1.4">INCIDENT INVESTIGATION</text>
      <line x1="42" y1="76" x2="446" y2="76" stroke="#FCFBF7" stroke-width="1.5" opacity=".25"/>
      <g fill="#FCFBF7" font-size="18" font-weight="700">
        <circle cx="54" cy="106" r="5" fill="#F5D66F"/><text x="70" y="112">Alerts, logs, metrics, traces</text>
        <circle cx="54" cy="140" r="5" fill="#90C2A5"/><text x="70" y="146">Deploys, ownership, runbooks</text>
      </g>
      <path d="M378 104l18 18 38-52" fill="none" stroke="#F5D66F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(886 330)">
      <rect width="222" height="138" rx="14" fill="#F4E4C1" stroke="#17202A" stroke-width="2"/>
      <path d="M38 27v25" stroke="#8B5E34" stroke-width="5" stroke-linecap="round"/>
      <circle cx="38" cy="66" r="4" fill="#8B5E34"/>
      <text x="64" y="46" fill="#17202A" font-size="19" font-weight="800">FALLBACKS</text>
      <text x="28" y="86" fill="#17202A" font-size="22" font-weight="800">Pause + route</text>
      <text x="28" y="115" fill="#59636E" font-size="14">Access, evidence, approval</text>
    </g>

    <path d="M314 399H356" stroke="#17202A" stroke-width="3" stroke-linecap="round"/>
    <path d="M346 389L356 399 346 409" fill="none" stroke="#17202A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M844 399H886" stroke="#17202A" stroke-width="3" stroke-linecap="round"/>
    <path d="M876 389L886 399 876 409" fill="none" stroke="#17202A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="94" y="548" fill="#59636E" font-size="16" font-weight="650">ggnagarkar.com  •  AI agents, SRE, incident response, and operational trust</text>
  </g>
</svg>
