<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The evolving evidence in engineering interviews</title>
  <desc id="desc">Three stages move from solving a bounded problem, to designing a maintainable system, to directing and reviewing AI-assisted work. Fundamentals and experience support every stage.</desc>
