<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">The full cycle of solving a real problem</title>
  <desc id="desc">Six steps: find a problem, talk to people, define the need, build and launch, support users, and measure and explain the result.</desc>
  <rect width="1200" height="510" fill="#f8fafc"/>
  <text x="50" y="63" fill="#0f172a" font-family="Arial, sans-serif" font-size="33" font-weight="700">One real problem. The full cycle of work.</text>
  <text x="50" y="100" fill="#475569" font-family="Arial, sans-serif" font-size="23">A useful project continues after the first version works.</text>
  <g font-family="Arial, sans-serif">
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
      <rect x="50" y="145" width="345" height="135" rx="8"/><rect x="428" y="145" width="345" height="135" rx="8"/><rect x="806" y="145" width="345" height="135" rx="8"/>
      <rect x="50" y="310" width="345" height="135" rx="8"/><rect x="428" y="310" width="345" height="135" rx="8"/><rect x="806" y="310" width="345" height="135" rx="8"/>
    </g>
    <g fill="#0f766e" font-size="25" font-weight="700">
      <text x="74" y="182">01</text><text x="452" y="182">02</text><text x="830" y="182">03</text>
      <text x="74" y="347">04</text><text x="452" y="347">05</text><text x="830" y="347">06</text>
    </g>
    <g fill="#0f172a" font-size="28" font-weight="700">
      <text x="74" y="221">Find a problem</text><text x="452" y="221">Talk to people</text><text x="830" y="221">Define the need</text>
      <text x="74" y="386">Build and launch</text><text x="452" y="386">Support users</text><text x="830" y="386">Measure results</text>
    </g>
    <g fill="#475569" font-size="21">
      <text x="74" y="253">Notice repeated friction</text><text x="452" y="253">Understand the current work</text><text x="830" y="253">Agree on a useful outcome</text>
      <text x="74" y="418">Put it into real use</text><text x="452" y="418">Fix what fails or confuses</text><text x="830" y="418">Explain what changed</text>
    </g>
  </g>
  <text x="50" y="486" fill="#475569" font-family="Arial, sans-serif" font-size="21">Keep the user involved, protect their data, and document what you learned.</text>
</svg>
